<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול תחנות - בדיקת API</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

    <style>
        body {
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            margin: 30px;
            background-color: #f4f6f9;
            color: #333;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            color: #0078d4;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
        }

            button:hover {
                background: #005a9e;
            }

        input[type="number"], input[type="text"] {
            padding: 9px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 120px;
        }

        .endpoint-row {
            margin: 15px 0;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        pre {
            background: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            direction: ltr;
            text-align: left;
            overflow-x: auto;
            max-height: 250px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .connected {
            background-color: #d4edda;
            color: #155724;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .connecting {
            background-color: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>

    <h1>מרכז בדיקות תחנות (Station API)</h1>

    <!-- אזור ה-REST API -->
    <div class="card">
        <h2>קריאות REST ל-Station</h2>

        <!-- Endpoint 1: כל התחנות -->
        <div class="endpoint-row">
            <p><strong>1. קבלת כל התחנות:</strong></p>
            <button onclick="getAllStations()">טען את כל התחנות (/api/Station)</button>
        </div>

        <!-- Endpoint 2: תחנה ספציפית לפי ID -->
        <div class="endpoint-row">
            <p><strong>2. קבלת תחנה ספציפית לפי מזהה:</strong></p>
            <input type="text" id="station-id-input" placeholder="הזן ID של תחנה" value="1" />
            <button onclick="getStationById()">טען תחנה לפי מזהה (/api/Station/{id})</button>
        </div>

        <h3>תשובה מהשרת:</h3>
        <pre id="rest-display">לחץ על אחד הכפתורים כדי לראות את המידע...</pre>
    </div>

    <!-- אזור ה-Real-Time (SignalR) -->
    <div class="card">
        <h2>נתונים חיים בזמן אמת (SignalR)</h2>
        <p>
            סטטוס חיבור:
            <span id="hub-status" class="status-badge connecting">מנסה להתחבר...</span>
        </p>

        <h3>מידע חי אחרון שהתקבל:</h3>
        <pre id="live-display">ממתין לעדכונים בזמן אמת...</pre>
    </div>

    <script>
        const BASE_URL = "http://localhost:5138";

        // 1. פונקציה לקריאת כל התחנות: GET /api/Station
        async function getAllStations() {
            const display = document.getElementById("rest-display");
            display.innerText = "שולח בקשה לכל התחנות...";

            try {
                const response = await fetch(`${BASE_URL}/api/Station`);
                if (!response.ok) {
                    throw new Error(`שגיאה ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                display.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                display.innerText = "נכשל:\n" + err.message;
            }
        }

        // 2. פונקציה לקריאת תחנה בודדת: GET /api/Station/{id}
        async function getStationById() {
            const display = document.getElementById("rest-display");
            const id = document.getElementById("station-id-input").value.trim();

            if (!id) {
                alert("נא להזין ID של תחנה");
                return;
            }

            display.innerText = `שולח בקשה לתחנה מספר ${id}...`;

            try {
                // שים לב לקו הנטוי לפני ה-ID: /api/Station/1
                const response = await fetch(`${BASE_URL}/api/Station/${id}`);
                if (!response.ok) {
                    throw new Error(`שגיאה ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                display.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                display.innerText = "נכשל:\n" + err.message;
            }
        }

        // 3. הגדרת SignalR לזמן אמת
        // שנה את /hub לנתיב שהגדרת ב-C# (למשל: app.MapHub<StationHub>("/stationHub"))
        const HUB_PATH = "/hub";

        const connection = new signalR.HubConnectionBuilder()
            .withUrl(`${BASE_URL}${HUB_PATH}`)
            .withAutomaticReconnect()
            .build();

        // שנה את "ReceiveStationUpdate" לשם המדויק שכתבת ב-Clients.All.SendAsync
        connection.on("ReceiveStationUpdate", (data) => {
            console.log("עדכון תחנה בזמן אמת:", data);
            document.getElementById("live-display").innerText =
                typeof data === "object" ? JSON.stringify(data, null, 2) : data;
        });

        const statusLabel = document.getElementById("hub-status");
        connection.start()
            .then(() => {
                statusLabel.innerText = "מחובר בהצלחה!";
                statusLabel.className = "status-badge connected";
            })
            .catch((err) => {
                statusLabel.innerText = "חיבור ה-Hub נכשל (נתיב או CORS)";
                statusLabel.className = "status-badge error";
                console.error("SignalR Connection Error:", err);
            });
    </script>
</body>
</html>
